services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: kfs
      POSTGRES_PASSWORD: kfs_password
      POSTGRES_DB: kfs_dev
    ports:
      - "5433:5432"   # 5433 avoids clashing with any local PostgreSQL
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d
volumes:
  pgdata: